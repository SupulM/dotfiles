set -g mouse on

# set-option -g status-position top
set -g default-terminal "tmux-256color"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_status_background "none"

# This forces Catppuccin to use standard tmux window naming
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_default_text " #W"

set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Catppuccin sets message-(command-)style with align=centre, which makes the
# rename-window/command prompt render over the middle of the status bar,
# overlapping the window list. Force it back to left-aligned.
set -ag message-style "align=left"
set -ag message-command-style "align=left"
